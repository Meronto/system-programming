arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb  -nostdlib -T linker.ld traffic_light.c -o traffic.elf && arm-none-eabi-objcopy -O binary traffic.elf traffic.bin
openocd -f interface/stlink.cfg -f target/stm32f4x.cfg -c "program traffic.bin 0x08000000 verify reset exit"

1. Короткие ножки идут на минус макетки, а длинные в любой другой пин
2. Для красного и зеленого светодиода используйте 220Ω, а для желтого 150Ω
3. Для подключения используйте схему подключения как на скрине
